# A small web API over the orders table: GET and POST /orders.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    napwake.dev/managed: "true"
  annotations:
    napwake.dev/dry-run: "false"
    napwake.dev/idle-after: "5m"
    # The forecast test: woken before weekday mornings once the forecast acts.
    napwake.dev/auto-resume: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      nodeSelector:
        tier: non-prod
      tolerations:
        - {key: tier, operator: Equal, value: non-prod, effect: NoSchedule}
      containers:
        - name: postgrest
          image: postgrest/postgrest:v16.4
          env:
            - {name: PGRST_DB_URI, value: "postgres://authenticator@postgres:5432/orders"}
            - {name: PGRST_DB_SCHEMAS, value: api}
            - {name: PGRST_DB_ANON_ROLE, value: web_anon}
            # Health checks on their own port: /ready answers once PostgREST
            # reaches postgres and has loaded its schema, so a woken API gets
            # traffic only when it can answer it.
            - {name: PGRST_ADMIN_SERVER_PORT, value: "3001"}
          ports:
            - containerPort: 3000
            - {name: admin, containerPort: 3001}
          readinessProbe:
            httpGet: {path: /ready, port: admin}
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
spec:
  ingressClassName: nginx
  rules:
    - host: orders.34.156.46.233.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
