# Google's Online Boutique: eleven services with real traffic between them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique
resources:
  - https://raw.githubusercontent.com/GoogleCloudPlatform/microservices-demo/v0.10.7/release/kubernetes-manifests.yaml
  - ingress.yaml
  - frontend-hpa.yaml
patches:
  # Its own load generator runs around the clock; apps/loadgen keeps
  # working hours instead.
  - target: {kind: Deployment, name: loadgenerator}
    patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: loadgenerator
  - target: {kind: ServiceAccount, name: loadgenerator}
    patch: |
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: loadgenerator
  # A second load balancer; the shared ingress serves the frontend instead.
  - target: {kind: Service, name: frontend-external}
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend-external
  # Hybernate manages every service, pausing for real since 2026-10-24
  # (dry-run Oct 21-24). The upstream manifests can't carry the label, so
  # a patch adds it to each Deployment's own metadata; commonLabels would
  # add it to their selectors too.
  - target: {kind: Deployment}
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: any
        labels:
          hybernate.io/managed: "true"
        annotations:
          hybernate.io/dry-run: "false"
  # Requests a team would give these services, about 2.9 vCPU in all, so
  # working hours need two or three spot nodes and a night of pauses
  # frees them. Upstream's CPU limits sit below these requests, so the
  # whole resources block is replaced: no CPU limit, its memory limit.
  - target: {kind: Deployment, name: "frontend"}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 400m, memory: 128Mi}
          limits: {memory: 128Mi}
  - target: {kind: Deployment, name: "adservice"}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 300m, memory: 300Mi}
          limits: {memory: 300Mi}
  - target: {kind: Deployment, name: "cartservice"}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 300m, memory: 128Mi}
          limits: {memory: 128Mi}
  - target: {kind: Deployment, name: "recommendationservice"}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 250m, memory: 256Mi}
          limits: {memory: 450Mi}
  - target: {kind: Deployment, name: "checkoutservice|currencyservice|emailservice|paymentservice|productcatalogservice|shippingservice"}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 250m, memory: 128Mi}
          limits: {memory: 128Mi}
  - target: {kind: Deployment, name: "redis-cart"}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 150m, memory: 256Mi}
          limits: {memory: 256Mi}
  # The frontend's ManagedWorkload, which Hybernate made from the label, has
  # an activity query on its ingress request rate, added as the dry-run
  # guide says, so it sees people's requests while it's awake (2026-10-24):
  #   kubectl patch managedworkload frontend -n boutique --type=json -p '[{"op":"add","path":"/spec/idlePolicy/activity/prometheus","value":[{"promQL":"sum(rate(nginx_ingress_controller_requests{exported_namespace=\"boutique\",exported_service=\"frontend\"}[5m]))"}]}]'
  # The other services are its dependencies, held awake while it is.
  # Every service runs on the spot workloads pool.
  - target: {kind: Deployment}
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {tier: non-prod}
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - {key: tier, operator: Equal, value: non-prod, effect: NoSchedule}
