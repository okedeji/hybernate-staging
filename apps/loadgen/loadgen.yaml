# Working-hours traffic: every 5 minutes, 09:00-17:59 New York time, Monday to
# Friday, a job of three shoppers browses the shop, places and lists
# orders, and reads a report for about four minutes. The shop and orders
# come in through ingress-nginx, by its in-cluster Service and the public
# host names, as people's requests do. Nights and weekends stay quiet.
# One shopper starts each loop by adding to its cart, a write: on a morning
# the shop wakes on a new node, it's held past nginx's 60s default, which
# retries reads but not writes, through the shop's proxy-read-timeout.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: working-hours
spec:
  schedule: "*/5 9-17 * * 1-5"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 285
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            tier: system
          containers:
            - name: traffic
              image: curlimages/curl:8.11.1
              resources:
                requests: {cpu: 10m, memory: 16Mi}
              command:
                - sh
                - -c
                - |
                  ingress=http://ingress-nginx-controller.ingress-nginx.svc.cluster.local
                  shop="Host: boutique.34.156.46.233.nip.io"
                  orders="Host: orders.34.156.46.233.nip.io"
                  reports=http://reports.reports.svc.cluster.local/hostname
                  end=$(( $(date +%s) + 270 ))
                  shopper() {
                    while [ "$(date +%s)" -lt "$end" ]; do
                      if [ "$1" = buyer ]; then
                        curl -s -o /dev/null -m 300 -H "$shop" \
                          -d 'product_id=OLJCESPC7Z&quantity=1' "$ingress/cart"
                      fi
                      curl -s -o /dev/null -m 300 -H "$shop" "$ingress/"
                      curl -s -o /dev/null -m 300 -H "$shop" "$ingress/product/OLJCESPC7Z"
                      curl -s -o /dev/null -m 300 -H "$orders" -H 'Content-Type: application/json' \
                        -d '{"item":"sunglasses","qty":1}' "$ingress/orders"
                      curl -s -o /dev/null -m 300 -H "$orders" "$ingress/orders?order=id.desc&limit=5"
                      curl -s -o /dev/null -m 300 "$reports"
                      sleep $(( $(od -An -N1 -tu1 /dev/urandom) % 10 + 2 ))
                    done
                  }
                  shopper buyer & shopper & shopper &
                  wait
