apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-loadgen
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/okedeji/hybernate-staging.git
    targetRevision: main
    path: apps/loadgen
  destination:
    server: https://kubernetes.default.svc
    namespace: loadgen
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Leave replicas to Hybernate (and the HPA): argocd-cm ignores
      # them in diffs, and this keeps syncs from setting them back.
      - RespectIgnoreDifferences=true
