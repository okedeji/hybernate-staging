# Hybernate itself, as its installation guide's Argo CD tab has it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hybernate
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/okedeji/charts
    chart: hybernate
    targetRevision: 0.2.0-rc.4
    helm:
      valuesObject:
        timezone: Africa/Lagos
        # Debug while finding why the forecast learns no live hour (P15); back to info after.
        logLevel: debug
        # A dev image of fix/prelaunch-findings-2 (P15, P18), to verify before the PR; back to the release after.
        image:
          repository: europe-west1-docker.pkg.dev/hybernate-prelaunch/hybernate-dev/hybernate
          tag: dev-c218c9c
        prometheus:
          url: http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090
  destination:
    server: https://kubernetes.default.svc
    namespace: hybernate-system
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
