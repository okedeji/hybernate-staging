# Hybernate itself, as its installation guide's Argo CD tab has it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hybernate
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/okedeji/charts
    chart: hybernate
    targetRevision: 0.2.0-rc.5
    helm:
      valuesObject:
        timezone: Africa/Lagos
        # A dev image of P26 (a restart keeps dry-run's would-be pauses and the idle clocks), to
        # verify on GKE before PR #64 merges; back to the release after.
        image:
          repository: europe-west1-docker.pkg.dev/hybernate-prelaunch/hybernate-dev/hybernate
          tag: dev-p26-da791df
        prometheus:
          url: http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090
  destination:
    server: https://kubernetes.default.svc
    namespace: hybernate-system
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
