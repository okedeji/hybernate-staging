# Hybernate itself, as its installation guide's Argo CD tab has it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hybernate
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/okedeji/charts
    chart: hybernate
    targetRevision: 0.2.0-rc.4
    helm:
      valuesObject:
        timezone: Africa/Lagos
        # A dev image of fix/prelaunch-findings-2, the PR for the pre-launch findings, until the next
        # release candidate: rc.4's forecast learns no live hour (P15), so the forecast test needs it.
        image:
          repository: europe-west1-docker.pkg.dev/hybernate-prelaunch/hybernate-dev/hybernate
          tag: dev-9801f14
        prometheus:
          url: http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090
  destination:
    server: https://kubernetes.default.svc
    namespace: hybernate-system
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
