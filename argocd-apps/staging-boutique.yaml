apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-boutique
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/okedeji/hybernate-staging.git
    targetRevision: main
    path: apps/boutique
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
