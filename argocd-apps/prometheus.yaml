# Prometheus for activity queries and Napwake's metrics. Kept small: no
# Grafana or Alertmanager, 7 days of data. Selectors are left at the chart's
# defaults on purpose: Napwake's docs should say what it needs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.11.0
    helm:
      valuesObject:
        grafana:
          enabled: false
        alertmanager:
          enabled: false
        # GKE runs these on the control plane, out of reach.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
        prometheusOperator:
          nodeSelector:
            tier: system
        kube-state-metrics:
          nodeSelector:
            tier: system
        prometheus:
          prometheusSpec:
            nodeSelector:
              tier: system
            retention: 7d
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: standard
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 10Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Its CRDs are too large for a client-side apply's annotation.
      - ServerSideApply=true
